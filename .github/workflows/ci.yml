# Validates the artifacts committed to the repo (the vitest suite, the
# TS -> ntcharts-spec envelope reference outputs under testdata/expected*,
# and compile/flint.wasm) WITHOUT invoking Javy: the wasm module is built
# locally via `make wasm` and committed, not rebuilt in CI. See README.md
# "Rebuilding the wasm module" for the local `make wasm` flow; downloading
# Javy in CI is a later nicety, not implemented here.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: js/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: JS deps
        run: cd js && npm ci
      - name: TS typecheck + tests
        run: cd js && npx tsc --noEmit && npx vitest run
      - name: Reference drift check
        run: |
          cd js && npm run gen-expected
          git diff --exit-code ../testdata/expected ../testdata/expected-terminal
      - name: Bundle builds (wasm source)
        run: cd js && npm run build
      # Binds the committed compile/flint.wasm to the source that produced it,
      # without needing Javy in CI: the esbuild bundle built one step above
      # must hash to the same bundle-sha256 recorded in
      # compile/flint.wasm.buildinfo by `make wasm` for the committed
      # flint.wasm. A mismatch means flint.wasm is stale relative to js/src --
      # someone ran `make wasm` against a different tree, or forgot to rerun
      # it, or edited js/dist by hand.
      - name: Wasm provenance check (bundle matches committed flint.wasm)
        run: |
          test "$(shasum -a 256 js/dist/flint-javy.js | cut -d' ' -f1)" = "$(grep '^bundle-sha256:' compile/flint.wasm.buildinfo | awk '{print $2}')"
      # go.mod has `replace github.com/NimbleMarkets/ntcharts/v2 => ../ntcharts`,
      # required both by speccheck/ (it cross-validates the emitted
      # ntcharts-spec JSON against the real ntcharts Go renderer) and by
      # compile/ (compile.go decodes the envelope's spec field directly into
      # ntcharts' spec.Spec). That sibling checkout does not exist in CI until
      # the ntcharts repo/branch is pushed somewhere this workflow can clone
      # it alongside this repo, so probe for it instead of hard-failing:
      # every Go test in this module needs the sibling now, so `go test ./...`
      # runs as a single guarded step, skipped with a warning annotation when
      # the sibling is absent rather than run partially. Revisit once
      # ../ntcharts is available in CI (vendor it in, or check out the
      # sibling repo explicitly).
      - name: Check ntcharts sibling
        id: ntcharts-sibling
        run: |
          if [ -d ../ntcharts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::../ntcharts sibling checkout not found (go.mod replace target) -- skipping go test ./... (both compile/ and speccheck/ now import ntcharts spec, so neither can run without it)."
          fi
      - name: Go tests (requires ../ntcharts sibling)
        if: steps.ntcharts-sibling.outputs.present == 'true'
        run: go build ./... && go test ./...
