# Validates the artifacts committed to the repo (the vitest suite, the
# TS -> ntcharts-spec envelope reference outputs under testdata/expected*,
# and compile/flint.wasm) WITHOUT invoking Javy: the wasm module is built
# locally via `make wasm` and committed, not rebuilt in CI. See README.md
# "Rebuilding the wasm module" for the local `make wasm` flow; downloading
# Javy in CI is a later nicety, not implemented here.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: js/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: JS deps
        run: cd js && npm ci
      - name: TS typecheck + tests
        run: cd js && npx tsc --noEmit && npx vitest run
      - name: Reference drift check
        run: |
          cd js && npm run gen-expected
          git diff --exit-code ../testdata/expected ../testdata/expected-terminal
      - name: Bundle builds (wasm source)
        run: cd js && npm run build
      # Binds the committed compile/flint.wasm to the source that produced it,
      # without needing Javy in CI: the esbuild bundle built one step above
      # must hash to the same bundle-sha256 recorded in
      # compile/flint.wasm.buildinfo by `make wasm` for the committed
      # flint.wasm. A mismatch means flint.wasm is stale relative to js/src --
      # someone ran `make wasm` against a different tree, or forgot to rerun
      # it, or edited js/dist by hand.
      - name: Wasm provenance check (bundle matches committed flint.wasm)
        run: |
          test "$(shasum -a 256 js/dist/flint-javy.js | cut -d' ' -f1)" = "$(grep '^bundle-sha256:' compile/flint.wasm.buildinfo | awk '{print $2}')"
      # compile/ decodes the envelope's spec field into ntcharts' spec.Spec and
      # speccheck/ renders every golden through the real ntcharts renderer;
      # both resolve ntcharts from the published module (go.mod requires
      # github.com/NimbleMarkets/ntcharts/v2 >= v2.5.0, the first release
      # that ships the spec package), so no sibling checkout is involved.
      - name: Go build, vet, tests
        run: go build ./... && go vet ./... && go test ./...
