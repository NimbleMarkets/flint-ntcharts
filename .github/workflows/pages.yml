name: Build and deploy browser demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: demo/go.mod
          cache-dependency-path: |
            go.sum
            demo/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install compiler dependencies
        working-directory: js
        run: npm ci
      - name: Build this revision's compiler shim
        run: make browser-shim
      - name: Build the site
        env:
          FLINTCHART_SHIM: ../js/dist/flintchart-shim.mjs
        run: cd demo && go run ./cmd/site
      - name: Smoke test the built wasm
        env:
          FLINT_SMOKE_COMBO: "1"
        run: cd demo && node smoke.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
